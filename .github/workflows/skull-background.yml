name: Skull background

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (empty = random). The same seed always renders the same animation."
        required: false

permissions:
  contents: read

concurrency:
  group: skull-background
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scripts/skull-render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/skull-render/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render
        run: node render.mjs ${SEED:+--seed "$SEED"}
        env:
          SEED: ${{ inputs.seed }}

      - name: Publish
        run: node publish.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_PUBLIC_URL: ${{ vars.MEDIA_PUBLIC_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: skull-poster
          path: |
            scripts/skull-render/out/*.webp
            scripts/skull-render/out/meta.json
